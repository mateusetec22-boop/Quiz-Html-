<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Básico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz">
    <h1>Quiz Básico</h1>

    <section id="quiz-area">
      <p id="progresso"></p>
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
      <button id="proxima" disabled>Próxima</button>
    </section>

    <section id="resultado" class="hidden">
      <h2>Fim do quiz!</h2>
      <p id="pontuacao"></p>
      <button id="reiniciar">Jogar de novo</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
